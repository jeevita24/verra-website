<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reset Password | VERRA</title>

  <link rel="stylesheet" href="style.css">

  <script src="supabase-config.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="announcement-bar">
    <div class="announcement">
      VERRA — MADE TO ORDER
    </div>
  </div>


  <header class="site-header">

    <div class="header-inner">

      <a href="index.html" class="brand">
        VERRA
      </a>

      <nav class="desktop-nav">

        <a href="products.html">
          LEHENGAS
        </a>

        <a href="about.html">
          ABOUT
        </a>

        <a href="contact.html">
          CONTACT
        </a>

        <a href="account.html">
          ACCOUNT
        </a>

      </nav>

    </div>

  </header>


  <main class="account-page">

    <section class="account-intro">

      <p class="eyebrow">
        VERRA ACCOUNT
      </p>

      <h1>
        Reset Your Password
      </h1>

      <p>
        Choose a new password for your VERRA account.
      </p>

    </section>


    <section class="account-card">

      <div
        class="account-message"
        id="resetMessage"
        role="status"
        aria-live="polite"
      ></div>


      <form
        id="resetPasswordForm"
        class="account-form"
      >

        <div class="form-group">

          <label for="newPassword">
            New Password
          </label>

          <input
            type="password"
            id="newPassword"
            autocomplete="new-password"
            minlength="8"
            required
          >

          <small>
            Use at least 8 characters.
          </small>

        </div>


        <div class="form-group">

          <label for="confirmPassword">
            Confirm New Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            autocomplete="new-password"
            minlength="8"
            required
          >

        </div>


        <button
          type="submit"
          class="account-submit"
          id="updatePasswordButton"
        >
          UPDATE PASSWORD
        </button>

      </form>

    </section>

  </main>


  <footer class="site-footer">

    <div class="footer-inner">

      <div class="footer-brand">
        VERRA
      </div>

      <p class="footer-copy">
        © VERRA. All rights reserved.
      </p>

    </div>

  </footer>


  <script>

    let supabaseClient = null;


    const form =
      document.getElementById(
        "resetPasswordForm"
      );

    const message =
      document.getElementById(
        "resetMessage"
      );

    const button =
      document.getElementById(
        "updatePasswordButton"
      );


    function showMessage(
      text,
      type = ""
    ) {

      message.textContent =
        text;

      message.className =
        "account-message";

      if (type) {
        message.classList.add(type);
      }

    }


    function getSupabaseConfig() {

      const config =
        window.VERRA_SUPABASE_CONFIG;

      if (
        !config ||
        !config.url ||
        !config.publishableKey ||
        !config.url.startsWith("https://")
      ) {
        throw new Error(
          "Supabase public configuration is incomplete."
        );
      }

      return config;

    }


    async function loadSupabase() {

      try {

        const config =
          getSupabaseConfig();


        supabaseClient =
          window.supabase.createClient(
            config.url,
            config.publishableKey
          );


        /*
          IMPORTANT:
          Listen for the recovery event.
        */

        supabaseClient.auth.onAuthStateChange(
          async (
            event,
            session
          ) => {

            console.log(
              "VERRA AUTH EVENT:",
              event
            );


            if (
              event ===
              "PASSWORD_RECOVERY"
            ) {

              showMessage(
                "Please choose your new password.",
                "success"
              );

              return;

            }


            if (
              event ===
              "SIGNED_IN" &&
              session
            ) {

              return;

            }

          }
        );


        /*
          Check whether Supabase
          already created a recovery session.
        */

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .getSession();


        if (error) {

          console.error(error);

          showMessage(
            "This password reset link could not be verified. Please request a new reset email.",
            "error"
          );

          return;

        }


        if (
          !data ||
          !data.session
        ) {

          showMessage(
            "Please open this page using the password reset link sent to your email.",
            "error"
          );

        }

      } catch (error) {

        console.error(error);

        showMessage(
          "We could not connect to your account service. Please try again.",
          "error"
        );

      }

    }


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        if (!supabaseClient) {

          showMessage(
            "Please wait a moment and try again.",
            "error"
          );

          return;

        }


        const password =
          document
            .getElementById(
              "newPassword"
            )
            .value;


        const confirmPassword =
          document
            .getElementById(
              "confirmPassword"
            )
            .value;


        if (
          password.length < 8
        ) {

          showMessage(
            "Your password must be at least 8 characters.",
            "error"
          );

          return;

        }


        if (
          password !==
          confirmPassword
        ) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;

        }


        button.disabled =
          true;

        button.textContent =
          "UPDATING...";


        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .updateUser({
                password
              });


          if (error) {
            throw error;
          }


          if (data && data.user) {

            showMessage(
              "Your password has been updated successfully.",
              "success"
            );


            form.reset();


            setTimeout(
              async () => {

                await supabaseClient.auth
                  .signOut();


                window.location.href =
                  "account.html";

              },
              2000
            );

          }

        } catch (error) {

          console.error(error);

          showMessage(
            error.message ||
            "We could not update your password. Please request a new reset link.",
            "error"
          );

        } finally {

          button.disabled =
            false;

          button.textContent =
            "UPDATE PASSWORD";

        }

      }
    );


    loadSupabase();

  </script>

</body>
</html>
