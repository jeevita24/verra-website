
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reset Password | VERRA</title>

  <meta
    name="description"
    content="Reset your VERRA account password."
  >

  <link rel="stylesheet" href="style.css">

  <script src="supabase-config.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /*
      VERRA RESET PASSWORD
      Visual styling only.
      Supabase authentication logic remains unchanged.
    */

    .reset-page {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px 20px 96px;
      background: #faf9f7;
    }

    .reset-wrapper {
      width: 100%;
      max-width: 520px;
    }

    .reset-intro {
      text-align: center;
      margin-bottom: 34px;
    }

    .reset-intro .eyebrow {
      margin-bottom: 14px;
      font-size: 11px;
      letter-spacing: 0.22em;
      font-weight: 600;
    }

    .reset-intro h1 {
      margin: 0;
      font-family: inherit;
      font-size: clamp(32px, 7vw, 46px);
      line-height: 1.08;
      font-weight: 400;
      letter-spacing: -0.025em;
    }

    .reset-intro p:last-child {
      max-width: 390px;
      margin: 18px auto 0;
      font-size: 15px;
      line-height: 1.7;
      color: #6f6a65;
    }

    .reset-card {
      background: #ffffff;
      border: 1px solid rgba(35, 31, 28, 0.10);
      padding: 42px 40px 44px;
      box-shadow:
        0 18px 50px rgba(35, 31, 28, 0.06);
    }

    .reset-card::before {
      content: "";
      display: block;
      width: 42px;
      height: 1px;
      background: currentColor;
      margin: 0 auto 30px;
      opacity: 0.35;
    }

    .reset-form {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .reset-field {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .reset-field label {
      font-size: 11px;
      line-height: 1.4;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .reset-field input {
      width: 100%;
      box-sizing: border-box;
      min-height: 52px;
      padding: 14px 15px;
      border: 1px solid rgba(35, 31, 28, 0.18);
      border-radius: 0;
      background: #fff;
      color: inherit;
      font: inherit;
      font-size: 15px;
      outline: none;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .reset-field input:focus {
      border-color: rgba(35, 31, 28, 0.55);
      box-shadow: 0 0 0 3px rgba(35, 31, 28, 0.05);
    }

    .reset-field small {
      font-size: 12px;
      line-height: 1.5;
      color: #817a74;
    }

    .reset-submit {
      width: 100%;
      min-height: 54px;
      margin-top: 5px;
      border: 1px solid #231f1c;
      border-radius: 0;
      background: #231f1c;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        opacity 0.2s ease;
    }

    .reset-submit:hover {
      background: transparent;
      color: #231f1c;
    }

    .reset-submit:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .reset-message {
      margin: 0 0 24px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      display: none;
    }

    .reset-message:not(:empty) {
      display: block;
    }

    .reset-message.success {
      background: #f3f5f1;
      color: #465345;
      border: 1px solid #dce4d8;
    }

    .reset-message.error {
      background: #faf3f2;
      color: #774d48;
      border: 1px solid #ead8d5;
    }

    .reset-note {
      margin: 28px 0 0;
      text-align: center;
      font-size: 12px;
      line-height: 1.7;
      color: #817a74;
    }

    .reset-note a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (max-width: 600px) {

      .reset-page {
        min-height: calc(100vh - 130px);
        padding: 48px 18px 72px;
        align-items: flex-start;
      }

      .reset-intro {
        margin-bottom: 26px;
      }

      .reset-intro h1 {
        font-size: 34px;
      }

      .reset-intro p:last-child {
        font-size: 14px;
        line-height: 1.65;
      }

      .reset-card {
        padding: 34px 22px 36px;
      }

      .reset-card::before {
        margin-bottom: 25px;
      }

      .reset-form {
        gap: 21px;
      }

    }
  </style>
</head>

<body>

  <!-- ANNOUNCEMENT BAR -->
  <div class="announcement-bar">
    <div class="announcement">
      VERRA — MADE TO ORDER
    </div>
  </div>


  <!-- HEADER -->
  <header class="site-header">

    <div class="header-inner">

      <a href="index.html" class="brand">
        VERRA
      </a>

      <nav class="desktop-nav">

        <a href="products.html">
          LEHENGAS
        </a>

        <a href="about.html">
          ABOUT
        </a>

        <a href="contact.html">
          CONTACT
        </a>

        <a href="account.html">
          ACCOUNT
        </a>

      </nav>

    </div>
  </header>


  <!-- RESET PASSWORD -->
  <main class="reset-page">

    <div class="reset-wrapper">

      <section class="reset-intro">

        <p class="eyebrow">
          VERRA ACCOUNT
        </p>

        <h1>
          Reset Your Password
        </h1>

        <p>
          Choose a new password for your VERRA account.
        </p>

      </section>


      <section class="reset-card">

        <div
          class="reset-message"
          id="resetMessage"
          role="status"
          aria-live="polite"
        ></div>


        <form
          id="resetPasswordForm"
          class="reset-form"
        >

          <div class="reset-field">

            <label for="newPassword">
              New Password
            </label>

            <input
              type="password"
              id="newPassword"
              autocomplete="new-password"
              minlength="8"
              required
            >

            <small>
              Use at least 8 characters.
            </small>

          </div>


          <div class="reset-field">

            <label for="confirmPassword">
              Confirm New Password
            </label>

            <input
              type="password"
              id="confirmPassword"
              autocomplete="new-password"
              minlength="8"
              required
            >

          </div>


          <button
            type="submit"
            class="reset-submit"
            id="updatePasswordButton"
          >
            UPDATE PASSWORD
          </button>

        </form>


        <p class="reset-note">
          After updating your password,
          you'll be returned to your VERRA account.
        </p>

      </section>

    </div>

  </main>


  <!-- FOOTER -->
  <footer class="site-footer">

    <div class="footer-inner">

      <div class="footer-brand">
        VERRA
      </div>

      <p class="footer-copy">
        © VERRA. All rights reserved.
      </p>

    </div>

  </footer>


  <!-- SUPABASE PASSWORD RESET LOGIC -->
  <script>

    let supabaseClient = null;


    const form =
      document.getElementById(
        "resetPasswordForm"
      );

    const message =
      document.getElementById(
        "resetMessage"
      );

    const button =
      document.getElementById(
        "updatePasswordButton"
      );


    function showMessage(
      text,
      type = ""
    ) {

      message.textContent =
        text;

      message.className =
        "reset-message";

      if (type) {
        message.classList.add(type);
      }

    }


    function getSupabaseConfig() {

      const config =
        window.VERRA_SUPABASE_CONFIG;


      if (
        !config ||
        !config.url ||
        !config.publishableKey ||
        !config.url.startsWith("https://")
      ) {

        throw new Error(
          "Supabase public configuration is incomplete."
        );

      }


      return config;

    }


    async function loadSupabase() {

      try {

        const config =
          getSupabaseConfig();


        supabaseClient =
          window.supabase.createClient(
            config.url,
            config.publishableKey
          );


        supabaseClient.auth.onAuthStateChange(
          async (
            event,
            session
          ) => {

            console.log(
              "VERRA AUTH EVENT:",
              event
            );


            if (
              event ===
              "PASSWORD_RECOVERY"
            ) {

              showMessage(
                "Please choose your new password.",
                "success"
              );

              return;

            }


            if (
              event ===
              "SIGNED_IN" &&
              session
            ) {

              return;

            }

          }
        );


        const {
          data,
          error
        } =
          await supabaseClient.auth
            .getSession();


        if (error) {

          console.error(error);

          showMessage(
            "This password reset link could not be verified. Please request a new reset email.",
            "error"
          );

          return;

        }


        if (
          !data ||
          !data.session
        ) {

          showMessage(
            "Please open this page using the password reset link sent to your email.",
            "error"
          );

        }

      } catch (error) {

        console.error(error);

        showMessage(
          "We could not connect to your account service. Please try again.",
          "error"
        );

      }

    }


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        if (!supabaseClient) {

          showMessage(
            "Please wait a moment and try again.",
            "error"
          );

          return;

        }


        const password =
          document
            .getElementById(
              "newPassword"
            )
            .value;


        const confirmPassword =
          document
            .getElementById(
              "confirmPassword"
            )
            .value;


        if (
          password.length < 8
        ) {

          showMessage(
            "Your password must be at least 8 characters.",
            "error"
          );

          return;

        }


        if (
          password !==
          confirmPassword
        ) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;

        }


        button.disabled =
          true;

        button.textContent =
          "UPDATING...";


        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .updateUser({
                password
              });


          if (error) {
            throw error;
          }


          if (data && data.user) {

            showMessage(
              "Your password has been updated successfully.",
              "success"
            );


            form.reset();


            setTimeout(
              async () => {

                await supabaseClient.auth
                  .signOut();


                window.location.href =
                  "account.html";

              },
              2000
            );

          }

        } catch (error) {

          console.error(error);

          showMessage(
            error.message ||
            "We could not update your password. Please request a new reset link.",
            "error"
          );

        } finally {

          button.disabled =
            false;

          button.textContent =
            "UPDATE PASSWORD";

        }

      }
    );


    loadSupabase();

  </script>

</body>
</html>
